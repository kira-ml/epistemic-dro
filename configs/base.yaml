# Frozen 2026-11-02 (protocol v1.0-etf). Any change after the docs freeze
# requires a deviation entry in docs/04_decision_log.md.
# Values marked TBD must be decided on validation data only -- never on the
# final test period.

freeze:
  protocol_version: v1.0-etf
  frozen: 2026-11-02
  decision: DEC-20261102-001
  docs_tag: docs-freeze-v1

project:
  name: epistemic-dro
  seed: 42
  timezone: UTC

data:
  source: public_etf  # Yahoo/Stooq adjusted ETF prices; provider recorded in MANIFEST.json
  start: 2005-01-01
  end: 2024-12-31
  frequency: monthly
  universe: us_liquid_etf  # 50-100 liquid US-listed ETFs; methods study
  max_assets: 100
  min_assets: 50
  min_history_months: 36
  min_price: 5.0
  min_adv_usd: 1000000
  risk_free: FRED:TB3MS  # monthly 3-month T-bill rate; convert to monthly return
  benchmark: SPY
  factors: Fama-French 3-factor + momentum

features:
  momentum_windows: [1, 3, 6, 12]
  volatility_windows: [3, 12]
  drawdown_window: 12
  liquidity_window: 12
  beta_window: 36
  metadata_fields: [expense_ratio, distribution_yield]
  factor_exposures: [mkt_rf, smb, hml, mom]
  winsorize: 0.01
  cross_sectional_rank: true

model:
  type: lightgbm
  objective: regression
  n_estimators: 300
  learning_rate: 0.03
  num_leaves: 15
  max_depth: 4
  min_child_samples: 50
  subsample: 0.8
  colsample_bytree: 0.8
  n_seeds: 5

uncertainty:
  method: ensemble  # ensemble | conformal
  conformal_alpha: 0.10
  min_sigma: 1.0e-6

optimization:
  ambiguity: box  # box | ellipsoid
  kappa: 1.0
  cvar_level: 0.95
  cvar_penalty: 1.0
  max_weight: 0.05
  turnover_penalty: 0.0
  cost_bps: 10
  solver: CLARABEL

evaluation:
  train_min_months: 60
  validation_months: 12
  test_months: 12
  purge_months: 1
  embargo_months: 1
  bootstrap_reps: 2000
  confidence: 0.90
  metrics:
    - net_sharpe
    - max_drawdown
    - cvar95
    - sortino
    - calmar
    - turnover
    - cost_drag
