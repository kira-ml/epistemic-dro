# Provisional configuration. Freeze every value in docs/02_experiment_card.md
# before a confirmatory run. Values marked TBD must be decided on validation
# data only -- never on the final test period.

project:
  name: epistemic-dro
  seed: 42
  timezone: UTC

data:
  source: TBD  # CRSP/Compustat via WRDS | Sharadar/Norgate | ETF/factor pivot
  start: 2005-01-01
  end: 2024-12-31
  frequency: monthly
  universe: TBD
  max_assets: 200
  min_history_months: 36
  min_price: 5.0
  min_adv_usd: 1000000
  risk_free: TBD
  benchmark: TBD

features:
  momentum_windows: [1, 6, 12]
  volatility_window: 12
  value_fields: [book_to_market, earnings_yield]
  quality_fields: [roe, gross_profitability]
  size_field: market_cap
  liquidity_window: 12
  winsorize: 0.01
  cross_sectional_rank: true

model:
  type: lightgbm
  objective: regression
  n_estimators: 300
  learning_rate: 0.03
  num_leaves: 15
  max_depth: 4
  min_child_samples: 50
  subsample: 0.8
  colsample_bytree: 0.8
  n_seeds: 5

uncertainty:
  method: ensemble  # ensemble | conformal
  conformal_alpha: 0.10
  min_sigma: 1.0e-6

optimization:
  ambiguity: box  # box | ellipsoid
  kappa: 1.0
  cvar_level: 0.95
  cvar_penalty: 1.0
  max_weight: 0.05
  turnover_penalty: 0.0
  cost_bps: 10
  solver: CLARABEL

evaluation:
  train_min_months: 60
  validation_months: 12
  test_months: 12
  purge_months: 1
  embargo_months: 1
  bootstrap_reps: 2000
  confidence: 0.90
  metrics:
    - net_sharpe
    - max_drawdown
    - cvar95
    - sortino
    - calmar
    - turnover
    - cost_drag
