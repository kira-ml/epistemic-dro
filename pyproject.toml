[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-dro"
version = "0.1.0"
description = "Epistemic-aware distributionally robust mean-CVaR portfolio research prototype"
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "Ken Ira Talingting" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "cvxpy>=1.4",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
ml = ["lightgbm>=4.3", "mapie>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
