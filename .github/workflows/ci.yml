name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,paper]"
      - name: Tests
        run: pytest -q
      - name: Lint
        run: ruff check .
      - name: Verify published results and paper numbers
        run: python scripts/verify_results.py
      - name: Build paper and visual assets
        run: python scripts/build_paper.py
      - name: Check paper artifact
        run: test -s paper/mini_paper.pdf
