name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,paper]"
      - name: Tests
        run: pytest -q
      - name: Lint
        run: ruff check .
      - name: Verify published results and paper numbers
        run: python scripts/verify_results.py
      - name: Build paper and visual assets
        run: |
          python scripts/build_paper.py 2>&1 | tee paper_build.log
      - name: Publish build log on failure
        if: failure()
        run: |
          echo "## Paper build log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -100 paper_build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Check paper artifact
        run: test -s paper/mini_paper.pdf
